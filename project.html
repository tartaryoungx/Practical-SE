<script id="blueprint-data" type="application/json">{"details": {"000": {"title": "Project foundation", "status": "In scope", "ref": "§03 / 000", "text": "Provide the local applications, database connectivity/migrations, environment settings, shared frontend API client, consistent backend errors, and initial roles/permissions required by Section 05.", "stories": ["000"], "related": [], "fields": {}, "ac": [{"id": "AC-000-01", "text": "Next.js App Router/TypeScript and FastAPI run as host processes using the four documented startup commands and working directories. Compose runs PostgreSQL only, with a health check, loopback port binding, configurable host port, and persistent named volume."}, {"id": "AC-000-02", "text": "Backend connects to PostgreSQL using SQLAlchemy and DATABASE_URL loaded from backend/.env; Alembic uses the same settings and creates the schema from an empty database with `alembic upgrade head`."}, {"id": "AC-000-03", "text": "Environment examples cover database URL, JWT configuration, cookie/CORS settings, upload directory, and frontend API base URL without working secrets (examples use placeholders)."}, {"id": "AC-000-04", "text": "Shared frontend API client and standard backend error format are used by implemented features."}, {"id": "AC-000-05", "text": "Repeated seeding preserves exactly the BR-01 roles and required permission definitions without duplication or overwriting configured grants/credentials; README covers migration, seed, startup, and test commands."}], "metadata": "Project foundation (Tartar; source estimate 9)"}, "001": {"title": "Sign in", "status": "In scope", "ref": "§03 / 001", "text": "Authenticate by email/password with `POST /auth/login`; display failures and redirect to an available destination appropriate to the user's role. Include logout as supporting behavior.", "stories": ["001"], "related": ["BR-05", "security"], "fields": {"Inputs": "email / password", "Output": "HTTP-only cookie for an active user; role/available-access redirect", "Decision": "Invalid credentials or disabled account → denied"}, "ac": [{"id": "AC-001-01", "text": "`users` persists ID, name, normalized email, password hash, role, and active status."}, {"id": "AC-001-02", "text": "`POST /auth/login` verifies credentials and issues an HTTP-only cookie only for an active user."}, {"id": "AC-001-03", "text": "Login form validates email/password, displays failures, and redirects by role/available access."}, {"id": "AC-001-04", "text": "Active valid credentials succeed; wrong passwords, unknown or disabled accounts fail; unauthenticated protected access is denied."}], "metadata": "Sign in (Wan; 10.5)"}, "002-1": {"title": "Manage own password", "status": "In scope", "ref": "§03 / 002-1", "text": "Provide current/new/confirm password UI and `POST /auth/change-password`. Provide token-based recovery through `POST /auth/reset-password` and a reset page. Make token delivery usable through P-RECOVERY; keep this separate from 003-5.", "stories": ["002-1"], "related": [], "fields": {}, "ac": [{"id": "AC-002-1-01", "text": "Authenticated `POST /auth/change-password` requires the correct current password and a valid new password; saves a new hash."}, {"id": "AC-002-1-02", "text": "Change Password page has current/new/confirm fields and checks matching confirmation."}, {"id": "AC-002-1-03", "text": "Reset-token persistence includes token hash, user reference, expiry, and used status/timestamp."}, {"id": "AC-002-1-04", "text": "`POST /auth/reset-password` validates the token and password, atomically consumes the token, and changes the hash."}, {"id": "AC-002-1-05", "text": "Reset Password page accepts the reset token and provides clear success/error states. A documented issuance path makes the flow usable end to end."}, {"id": "AC-002-1-06", "text": "Wrong current password, invalid new password, and invalid/expired/used tokens leave the password unchanged; successful change/reset rejects the old password and protects token confidentiality as required in Section 05."}], "metadata": "Manage own password (Chompoo; 11.5)"}, "002-2": {"title": "Own profile", "status": "In scope", "ref": "§03 / 002-2", "text": "`GET /users/me` and Profile show the current account's name, email, role, and status; anonymous access is blocked.", "stories": ["002-2"], "related": [], "fields": {}, "ac": [{"id": "AC-002-2-01", "text": "`GET /users/me` returns only the current user's safe basic information."}, {"id": "AC-002-2-02", "text": "Profile displays name, email, role, and account status; unauthenticated access is blocked."}, {"id": "AC-002-2-03", "text": "Each of the four roles receives its own correct profile; `/users/me` resolves to the current-user endpoint."}], "metadata": "Own profile (Pink; 4)"}, "003-1": {"title": "View users", "status": "In scope", "ref": "§03 / 003-1", "text": "`GET /users` feeds an administrative table showing name, email, role, and active/disabled status.", "stories": ["003-1"], "related": [], "fields": {}, "ac": [{"id": "AC-003-1-01", "text": "Admin-only `GET /users` returns safe account information."}, {"id": "AC-003-1-02", "text": "User Management table displays name, email, role, and active/disabled status clearly, with loading, empty, and error states."}, {"id": "AC-003-1-03", "text": "Non-admin API requests are denied even if they bypass the UI."}], "metadata": "View users (Fares; 5.5)"}, "003-2": {"title": "Create users", "status": "In scope", "ref": "§03 / 003-2", "text": "`POST /users` and Add User accept name, email, role, and initial password, with store assignment under P-STORE. Refresh the table after success.", "stories": ["003-2"], "related": ["BR-04", "P-STORE"], "fields": {"Inputs": "name, email, role, initial password; store assignment under P-STORE", "Output": "Staff account; refreshed user table", "Rules": "BR-04 / P-STORE"}, "ac": [{"id": "AC-003-2-01", "text": "Admin-only `POST /users` accepts name, email, an allowed role, and initial password, plus store association under P-STORE."}, {"id": "AC-003-2-02", "text": "Validate required fields, password, duplicate normalized email, and invalid role."}, {"id": "AC-003-2-03", "text": "Add User form displays actionable validation errors and refreshes the table on success."}, {"id": "AC-003-2-04", "text": "A valid account is created once; duplicate email, invalid role, or missing required fields creates no account."}], "metadata": "Create users (Wan; 6.5)"}, "003-3": {"title": "Edit users", "status": "In scope", "ref": "§03 / 003-3", "text": "`PATCH /users/{id}` and a prefilled Edit User form update the allowed profile fields in BR-04; show saved values.", "stories": ["003-3"], "related": [], "fields": {}, "ac": [{"id": "AC-003-3-01", "text": "Admin-only `PATCH /users/{id}` permits only explicitly editable profile fields."}, {"id": "AC-003-3-02", "text": "Reject protected-field changes, invalid values, duplicate email, and missing users appropriately."}, {"id": "AC-003-3-03", "text": "Edit User form is prefilled and updates the table after saving."}, {"id": "AC-003-3-04", "text": "Valid updates persist; invalid updates and role/status/password mutations through this endpoint are rejected without changing the account."}], "metadata": "Edit users (Tartar; 5)"}, "003-4": {"title": "Disable/reactivate users", "status": "In scope", "ref": "§03 / 003-4", "text": "`PATCH /users/{id}/status` and table actions change account status according to BR-04.", "stories": ["003-4"], "related": [], "fields": {}, "ac": [{"id": "AC-003-4-01", "text": "Admin-only `PATCH /users/{id}/status` updates `is_active`."}, {"id": "AC-003-4-02", "text": "Reject an administrator disabling their own account."}, {"id": "AC-003-4-03", "text": "Disable/Reactivate UI reflects the updated state; disabled users cannot log in or continue authenticated API access."}, {"id": "AC-003-4-04", "text": "Disabling blocks login and existing sessions; reactivation permits login; self-disable leaves the account active."}], "metadata": "Disable/reactivate users (Chompoo; 5)"}, "003-5": {"title": "Admin reset password", "status": "In scope", "ref": "§03 / 003-5", "text": "`POST /users/{id}/reset-password` accepts or generates a temporary password. Provide confirmation and an intentional result view if a password is generated.", "stories": ["003-5"], "related": [], "fields": {}, "ac": [{"id": "AC-003-5-01", "text": "Admin-only `POST /users/{id}/reset-password` accepts or securely generates a temporary password and saves only its hash."}, {"id": "AC-003-5-02", "text": "User table includes Reset Password with confirmation and clear success/error feedback. If generated, show the temporary password only in the intentional result view and never in logs or account lists."}, {"id": "AC-003-5-03", "text": "After reset, the old password fails and the new password works; non-admin reset attempts are denied."}], "metadata": "Admin reset password (Pink; 5)"}, "004-1": {"title": "Assign roles", "status": "In scope", "ref": "§03 / 004-1", "text": "`PATCH /users/{id}/role` and a role selector update the user's role subject to Section 04.", "stories": ["004-1"], "related": [], "fields": {}, "ac": [{"id": "AC-004-1-01", "text": "Admin-only `PATCH /users/{id}/role` validates against exactly the four roles and enforces P-STORE."}, {"id": "AC-004-1-02", "text": "Admin User Management includes a role selector and updates after saving."}, {"id": "AC-004-1-03", "text": "Invalid roles are rejected; valid changes affect the next request in an existing session; demoting the last active administrator is rejected."}], "metadata": "Assign roles (Fares; 4.5)"}, "004-2": {"title": "Configure permissions", "status": "In scope", "ref": "§03 / 004-2", "text": "Persist permissions and role grants; seed definitions for Account, Return, Batch, Outcome, Validation, and Report. Provide reusable `require_permission()`, `GET /roles/permissions`, and an atomic `PUT /roles/{role}/permissions`, plus a roles × permissions editor. Mark future-module keys reserved; apply U-ACCESS before enabling unsupported grants.", "stories": ["004-2"], "related": [], "fields": {}, "ac": [{"id": "AC-004-2-01", "text": "Persist `permissions` and `role_permissions`; seed stable action keys grouped under Account, Return, Batch, Outcome, Validation, Report."}, {"id": "AC-004-2-02", "text": "Define only the Account/Return action keys required by implemented endpoints. For the four future modules, seed clearly labeled reserved access keys without claiming their features exist."}, {"id": "AC-004-2-03", "text": "Implement reusable `require_permission()` and use it on applicable protected endpoints."}, {"id": "AC-004-2-04", "text": "Admin-only `GET /roles/permissions` returns the matrix; `PUT /roles/{role}/permissions` validates and atomically replaces that role's permissions. Reject unknown roles/keys."}, {"id": "AC-004-2-05", "text": "Matrix UI shows roles × permissions, supports saving changes, and surfaces failures."}, {"id": "AC-004-2-06", "text": "Endpoint permission checks and initial grants are identifiable in code/OpenAPI; each role has an allowed and blocked action under Section 04, including denied Return access for ADMIN without a permission bypass."}, {"id": "AC-004-2-07", "text": "Permission edits affect the next request in existing sessions; edits that would lock out access administration are rejected."}], "metadata": "Configure permissions (Tartar; 13)"}, "004-3": {"title": "Review access", "status": "In scope", "ref": "§03 / 004-3", "text": "Reuse the permission read endpoint for a read-only view grouped by role, clearly showing allowed/blocked permissions and effective restrictions.", "stories": ["004-3"], "related": [], "fields": {}, "ac": [{"id": "AC-004-3-01", "text": "Reuse the matrix read endpoint for an admin-only read-only Role Access page grouped by role."}, {"id": "AC-004-3-02", "text": "Display both allowed and blocked permissions clearly, including future-module labels."}, {"id": "AC-004-3-03", "text": "After a permission edit, the read-only view matches persisted values using the existing read contract."}], "metadata": "Review access (Wan; 4)"}, "005-1": {"title": "Record returned garment", "status": "In scope", "ref": "§03 / 005-1", "text": "`POST /garments` and Record Garment save the BR-02 fields, then show the generated ID and link to detail.", "stories": ["005-1"], "related": ["BR-02", "P-STORE"], "fields": {"Inputs": "type, material, positive finite weight in kilograms", "Output": "Generated ID, store, creator, creation time; unassessed draft", "Rules": "BR-02 / P-STORE"}, "ac": [{"id": "AC-005-1-01", "text": "Persist garment type and material as text, positive weight in kilograms, store, creator, creation timestamp, and generated ID. Each record represents one garment item."}, {"id": "AC-005-1-02", "text": "`POST /garments` validates required fields and positive finite weight, derives creator/store from the current user, and checks Return permissions."}, {"id": "AC-005-1-03", "text": "Record Returned Garment form shows successful creation, generated ID, and a link to garment detail."}, {"id": "AC-005-1-04", "text": "Missing fields, invalid weight, missing store association, or store spoofing are rejected; valid input saves one garment under P-STORE."}, {"id": "AC-005-1-05", "text": "Provide the minimal list and safe `GET /garments` specified in Section 03; Staff can find a saved record again without retaining its URL."}], "metadata": "Record returned garment (Chompoo; 9)"}, "005-2": {"title": "Assess condition and attach evidence", "status": "In scope", "ref": "§03 / 005-2", "text": "`PATCH /garments/{id}/condition` saves assessment; `POST /garments/{id}/evidence` saves validated files and metadata. Detail provides condition selection, upload/view controls, and the evidence requirement.", "stories": ["005-2"], "related": ["BR-01", "P-EVIDENCE", "P-ROUTE"], "fields": {"Inputs": "condition; evidence files", "Output": "Saved assessment and recommendation; file metadata", "Rules": "P-EVIDENCE; confirmation is the evidence gate"}, "ac": [{"id": "AC-005-2-01", "text": "Accept exactly the four conditions in BR-01; reject other condition values."}, {"id": "AC-005-2-02", "text": "`PATCH /garments/{id}/condition` updates an authorized garment and triggers recommendation calculation."}, {"id": "AC-005-2-03", "text": "Persist evidence metadata: original filename, internal storage path, garment ID, uploader; additional MIME/size/timestamp fields are acceptable when needed for validation."}, {"id": "AC-005-2-04", "text": "`POST /garments/{id}/evidence` stores validated evidence and metadata; an authorized evidence retrieval endpoint supports viewing the uploaded result."}, {"id": "AC-005-2-05", "text": "Garment detail includes condition selection, evidence uploader/list, and a visible explanation of conditional evidence requirements."}, {"id": "AC-005-2-06", "text": "Draft condition changes and valid uploads succeed under P-EVIDENCE; invalid/oversized uploads and cross-store access are denied, with required evidence enforced at confirmation."}], "metadata": "Assess condition and attach evidence (Pink; 9.5)"}, "005-3": {"title": "Recommended route", "status": "In scope", "ref": "§03 / 005-3", "text": "`GET /garments/{id}` returns the saved recommendation; the Recommended Route card also handles an unassessed garment.", "stories": ["005-3"], "related": ["P-ROUTE"], "fields": {"Input": "Saved condition", "Output": "Persisted recommendation; absent before assessment", "Rule": "P-ROUTE (provisional)"}, "ac": [{"id": "AC-005-3-01", "text": "Persist a BR-01 destination using P-ROUTE; changing a draft condition recalculates the recommendation."}, {"id": "AC-005-3-02", "text": "`GET /garments/{id}` returns the safe garment detail, evidence metadata, and recommendation."}, {"id": "AC-005-3-03", "text": "Recommended Route card handles both unassessed and assessed garments."}, {"id": "AC-005-3-04", "text": "Each condition produces the P-ROUTE recommendation; before assessment the recommendation is absent."}], "metadata": "Recommended route (Fares; 5.5)"}, "005-4": {"title": "Confirm or override route", "status": "In scope", "ref": "§03 / 005-4", "text": "`POST /garments/{id}/confirm-route` and Confirm/Override UI persist the final decision under BR-03.", "stories": ["005-4"], "related": ["BR-03", "P-EVIDENCE"], "fields": {"Inputs": "Final route, optional note; assessment and required evidence", "Output": "Confirmed route, note, time; read-only assessment/evidence", "Decision": "Override → nonblank trimmed note; BR-03"}, "ac": [{"id": "AC-005-4-01", "text": "Persist confirmed route, override reason/note, and confirmation timestamp."}, {"id": "AC-005-4-02", "text": "`POST /garments/{id}/confirm-route` accepts an allowed final route and optional note."}, {"id": "AC-005-4-03", "text": "Permit matching the recommendation without an override note; require a nonblank trimmed note when routes differ."}, {"id": "AC-005-4-04", "text": "Reject confirmation before assessment, invalid routes, missing required evidence, unauthorized access, and repeated confirmation under BR-03."}, {"id": "AC-005-4-05", "text": "UI supports both Confirm and Override, shows conditional note validation, and displays the saved final route."}, {"id": "AC-005-4-06", "text": "Normal confirmation and a valid override succeed; blank override notes, missing required evidence, and post-confirmation assessment mutations are rejected."}, {"id": "AC-005-4-07", "text": "Revisiting saved detail displays final route, note, condition, and evidence in read-only form."}], "metadata": "Confirm or override route (Tartar; 7)"}, "BR-01": {"title": "Allowed values", "status": "Confirmed", "ref": "§04 / BR-01", "text": "Roles are exactly `ADMIN`, `STORE_STAFF`, `CONTRACTOR`, `HEAD`; conditions exactly `GOOD`, `WORN`, `DAMAGED`, `STAINED`; destinations exactly `DIRECT_RESALE_CANDIDATE`, `THIRD_PARTY_CONTRACTOR`. A resale candidate is not a completed resale, and contractor routing is not a recycling outcome.", "stories": [], "related": [], "fields": {}}, "BR-02": {"title": "Garment data", "status": "Confirmed", "ref": "§04 / BR-02", "text": "One record represents one item. Persist generated ID, required text type/material, positive finite weight in kilograms, store, creator, and creation time. Condition alone determines recommendation; no type/material routing rules.", "stories": [], "related": [], "fields": {}}, "BR-03": {"title": "Assessment and confirmation", "status": "Confirmed", "ref": "§04 / BR-03", "text": "Creation saves an unassessed draft. Saving condition updates recommendation. Staff may confirm the recommendation without a note or choose the other valid route with a nonblank trimmed override note. Confirmation requires assessment and any P-EVIDENCE proof, persists route/note/time, and makes the route and relevant assessment/evidence read-only. Reject repeated confirmation; retain view access. No reopening/revision workflow.", "stories": [], "related": [], "fields": {}}, "BR-04": {"title": "Account administration", "status": "Confirmed", "ref": "§04 / BR-04", "text": "User/role/permission administration is ADMIN-only. General user edit allows name/email only; role, status, and password changes use designated actions. Prevent Admin self-disable and removing the last usable administrator's management access.", "stories": [], "related": [], "fields": {}}, "BR-05": {"title": "Self-service", "status": "Confirmed", "ref": "§04 / BR-05", "text": "Every active role can authenticate, view its own profile, and manage its own password. Password change requires the current password. Recovery requires an unexpired unused valid token. Admin reset replaces another user's password with an accepted/generated temporary password. No forced first-login password change.", "stories": [], "related": [], "fields": {}}, "BR-06": {"title": "Authorization", "status": "Confirmed", "ref": "§04 / BR-06", "text": "Current permission grants apply on subsequent requests. Administrative grants cannot bypass BR-04. Return access additionally obeys P-STORE. No implicit ADMIN bypass. Authentication/self-service remains available to active accounts. Garment list/detail/evidence share read authorization; reset-link issuance requires Admin reset authority; store selection uses applicable account-management authority.", "stories": [], "related": [], "fields": {}}, "P-ROUTE": {"title": "P-ROUTE", "status": "Provisional", "ref": "§04 / P-ROUTE", "text": "GOOD → DIRECT_RESALE_CANDIDATE; WORN/DAMAGED/STAINED → THIRD_PARTY_CONTRACTOR.", "stories": [], "related": [], "fields": {}}, "P-EVIDENCE": {"title": "P-EVIDENCE", "status": "Provisional", "ref": "§04 / P-EVIDENCE", "text": "GOOD/WORN evidence optional; DAMAGED/STAINED evidence required before confirmation. Condition may be saved before uploading. Accepted formats are JPEG, PNG, WebP; size limit is a technical decision.", "stories": [], "related": [], "fields": {}}, "P-STORE": {"title": "P-STORE", "status": "Provisional", "ref": "§04 / P-STORE", "text": "Each Staff user has one administrator-assigned seeded store. Set garment store/creator from authenticated identity; reject missing assignment/spoofing. Staff may access colleagues' same-store records subject to permissions, never other stores' records. Support initial assignment on user creation/assignment to Staff; no transfer workflow.", "stories": [], "related": [], "fields": {}}, "P-RECOVERY": {"title": "P-RECOVERY", "status": "Provisional", "ref": "§04 / P-RECOVERY", "text": "Admin creates a short-lived single-use reset link for manual delivery. Provide the minimal issuing action and public token-reset form; no email infrastructure.", "stories": [], "related": [], "fields": {}}, "U-ACCESS": {"title": "Cross-role Return grants", "status": "Unresolved", "ref": "§04 / U-ACCESS", "text": "**U-ACCESS:** May Return permissions grant operational access to ADMIN/HEAD/CONTRACTOR beyond the initial matrix, and how would their store association work? Ask before implementing such grants. Continue the initial configuration and real revocation/restoration within supported operations. Do not silently persist ineffective grants or invent cross-role workflows. If unanswered, report the affected configuration case as blocked rather than claim the policy fully resolved. UI must distinguish configured permission from effective access wherever a mandatory restriction applies.", "stories": [], "related": ["BR-06", "P-STORE"], "fields": {}}, "purpose": {"title": "Textile Take-back and Recycling Management System", "status": "In scope", "ref": "§01", "text": "Act as a senior full-stack coding agent assisting one developer. Build a maintainable, working Sprint 1 MVP, including frontend, backend, database, and meaningful verification. Inspect the repository and applicable instructions first; preserve unrelated work.\n\nThe Textile Take-back and Recycling Management System supports a mid-sized retailer's in-store used-clothing take-back program and SDG 12. Customers return clothing for store credit. Staff record and assess garments, then confirm routing toward potential resale or external sorting. Long-term transparency and sustainability reporting explain the product purpose, not additional Sprint 1 work.\n\nThe expected outcome is a usable account-administration and garment-return flow: an administrator creates Staff, Staff records and routes a garment, and its saved result can be found again. Other roles receive the account capabilities specified below. Deliver working behavior, not scaffolding alone.", "stories": [], "related": [], "fields": {}}, "sources": {"title": "Source of Truth & Scope", "status": "Source conflict", "ref": "§02", "text": "1. Product Backlog defines included features.\n2. Sprint Goal and Definition of Done define behavior within that scope.\n3. Business Context and Story Map clarify purpose.\n4. This prompt supplies technical guidance and explicitly classified assumptions.\n\nExplicit user clarifications govern the decisions recorded here. The original backlog was supplied; the other source documents are known through the user's clarification, not independently reviewed originals. Do not claim otherwise.\n\nImplement exactly **16 Story IDs**: `000`, `001`, `002-1`, `002-2`, `003-1`, `003-2`, `003-3`, `003-4`, `003-5`, `004-1`, `004-2`, `004-3`, `005-1`, `005-2`, `005-3`, `005-4`. References to “14 stories” were a counting error. Add or remove none. Original owners and estimates retained in Section 06 are historical metadata, not solo-development assignments.\n\n| Conflict | Status |\n|---|---|\n| Backlog Admin administration versus reported Sprint DoD Head/Developer administration | Source inconsistency remains. The user explicitly selected the backlog's ADMIN-only boundary for Sprint 1; BR-04 records that implementation decision. No fifth role. |\n| Configurable permissions versus role-limited operations | Mandatory administration restrictions are settled. Cross-role Return grants and associated store assignments remain unresolved under U-ACCESS in Section 04. Do not silently invent a policy. |\n| Business rules presented as confirmed in earlier drafts | Corrected by the classifications in Section 04. Provisional rules are authorized for MVP use but not confirmed permanent policy. |\n\nFor a new blocking business ambiguity, ask a focused question and continue independent work. Record unanswered decisions briefly in the acceptance checklist. Successful tests against assumptions do not resolve business questions.", "stories": [], "related": [], "fields": {}}, "scope": {"title": "Included and excluded scope", "status": "Scope", "ref": "§02", "text": "Include project foundation, authentication/profile/password management, account administration, role/permission configuration and review, garment recording/assessment/evidence/recommendation/confirmation, and the supporting retrieval needed for the demo.\n\nExclude public signup, customer/credit management, completed resale, store CRUD/transfers, multiple-store assignments, pickup batches/FIFO, contractor receipt, sorting outcomes, final end-of-life tracking, sustainability validation/issue-resolution workflows, reports/exports/history, and reopening/audit-history interfaces. Future-module permission definitions are required by 004-2; their workflows are not.", "stories": [], "related": [], "fields": {}}, "support": {"title": "Supporting functions", "status": "In scope", "ref": "§03", "text": "- Provide a minimal `/garments` list and `GET /garments` so permitted Staff can find draft/confirmed records without remembering URLs. Show ID, type, creation time, condition, and confirmed route or unconfirmed state; link rows to detail. Use a simple safe listing strategy; if paginated, all accessible records must remain reachable. No search, bulk actions, exports, or dashboard.\n- Detail exposes safe basic data, store, condition, evidence references, recommendation, confirmed route/note/time. It supports resuming drafts and viewing confirmed records after refresh or a new session.\n- Provide authorized evidence retrieval, minimal seeded-store selection for account setup, and an admin action to issue a recovery link. Suggested supporting paths: `POST /auth/logout`, `GET /stores`, `POST /users/{id}/reset-link`, `GET /garments/{id}/evidence/{evidence_id}`. Equivalent simple contracts are acceptable where not mandated by the backlog.", "stories": ["005-1", "005-3", "005-4"], "related": [], "fields": {}}, "security": {"title": "Security and integrity guarantees", "status": "Technical constraint", "ref": "§05", "text": "- Hash passwords using an established library; validate consistently and never log plaintext credentials. Store JWTs only in HTTP-only cookies with appropriate expiry, SameSite, Secure settings, and matching deletion on logout; no JavaScript-accessible token storage.\n- Validate JWT signature/expiry and load the current active user/role/grants. Disabled accounts cannot sign in or use existing sessions. Password changes/resets invalidate prior sessions by a simple suitable mechanism. Use generic credential failure messages.\n- Configure explicit credentialed CORS origins and protect cookie-authenticated mutations against CSRF. UI visibility is not authorization.\n- Store reset token hashes with user, expiry, and used state; consume atomically. Reveal reset links/temporary credentials only through intentional delivery results, not logs or ordinary responses.\n- Normalize email and enforce database uniqueness, foreign keys, valid enum values, positive weight, and timezone-aware timestamps. Reject protected/unknown input fields. Do not return hashes, private storage paths, or stack traces.\n- Keep condition/recommendation updates consistent and confirmation atomic. Concurrent writes must not bypass finality, token single use, uniqueness, or last-admin protection. Simple constraints/transactions/locking suffice.\n- Validate evidence content/type/size, generate safe storage names, keep files outside public directories, and authorize upload/retrieval against the parent garment. Remove uploaded files if metadata persistence fails.\n- Apply store restrictions in database queries before list limits/counts; do not filter unauthorized records in the browser. Avoid leaks through detail, evidence, or counts.", "stories": [], "related": [], "fields": {}}, "architecture": {"title": "Domain-based modular monolith", "status": "Technical constraint", "ref": "§05", "text": "Keep Next.js App Router + TypeScript; FastAPI + Pydantic; SQLAlchemy + Alembic; PostgreSQL. One backend application contains `auth`, `users`, `access_control`, and `returns` domains. Keep frontend features aligned to those domains.\n\n```text\nfrontend/src/\n  app/                  # Routes/layouts and page composition\n  features/             # auth, users, access_control, returns\n  components/ui/        # Small shared UI elements\n  lib/                  # Shared API client and public configuration\nbackend/app/\n  main.py               # App composition\n  core/                 # Settings, database/session, security primitives, errors\n  domains/              # auth, users, access_control, returns\n  seed.py               # Idempotent setup\nbackend/alembic/\nbackend/tests/\nfrontend/tests/\ndocs/acceptance.md\ncompose.yaml\n.env.example\nREADME.md\n```\n\nWithin a domain, use routers, services, models, and schemas as needed. Routers validate/authorize and invoke services; services own business rules and transactions and may query SQLAlchemy directly. Models define persistence/constraints; schemas explicitly allow input/output fields. Dependencies resolve identity and enforce authorization. Returns owns recommendation policy and evidence storage. Core contains infrastructure, not domain policy.\n\nPages compose feature UI; feature code owns forms and domain API calls through the shared client. Avoid generic repositories/frameworks, speculative abstractions, and empty files. Choose simple compatible dependencies and reproducible versions. Non-mandated IDs, permission-key names, token lifetimes, password policy, upload limits, pagination, and transaction mechanisms are technical decisions, not new business rules.", "stories": [], "related": [], "fields": {}}, "database": {"title": "Database and API boundaries", "status": "Technical constraint", "ref": "§05", "text": "Use users, minimal stores, fixed roles, permissions, role_permissions, reset tokens, garments, and evidence metadata as required by their stories. No future-module business tables. Users reference a role and store under P-STORE; garments reference store/creator; evidence references garment/uploader. Keep recommendation distinct from confirmation. Persist only safe password/token representations as below.\n\nUse Alembic, not runtime table creation. API and migrations share settings. Seed idempotently without resetting existing credentials or overwriting configured grants. Keep test fixtures separate. Document actual contracts through FastAPI/OpenAPI, with one shared error shape such as `{ \"error\": { \"code\": \"...\", \"message\": \"...\", \"details\": [] } }`. Use 401 for missing/invalid authentication and 403 for authorization denial; choose consistent appropriate validation/conflict/not-found statuses. Frontend API requests include credentials and handle these errors consistently.", "stories": ["000"], "related": [], "fields": {}}, "setup": {"title": "Host applications and PostgreSQL-only Docker", "status": "Technical constraint", "ref": "§05", "text": "Create root `compose.yaml` with exactly one PostgreSQL service, persistent named volume, `pg_isready` health check, and loopback binding equivalent to `127.0.0.1:${POSTGRES_PORT:-5432}:5432`. Choose a supported image and correct data-volume path. FastAPI and Next.js run locally; no application containers, proxies, queues, or extra infrastructure.\n\nProvide root `.env.example` for database name/user/password placeholders and `POSTGRES_PORT=5432`; backend `.env.example` for `DATABASE_URL`, JWT/cookie/CORS/upload settings; frontend `.env.example` for `NEXT_PUBLIC_API_BASE_URL=http://localhost:8000`. Ignore real secrets. Frontend uses `.env.local`, never database/private credentials.\n\nFor psycopg, a backend URL example is `postgresql+psycopg://garment_app:replace_me@localhost:5432/garment_returns`; install its compatible driver. FastAPI and Alembic load the same backend `.env`. Match Compose credentials and URL-encode passwords. If port 5432 is occupied, change the exposed port and URL together. Use host `localhost`, not the Compose service hostname. Browser origin is `http://localhost:3000`.\n\nAfter documented environment copying, Python virtualenv/dependency setup, and Node dependency installation:\n\n1. Root: `docker compose up -d`; wait for healthy PostgreSQL.\n2. `backend/`, virtualenv active: `alembic upgrade head`.\n3. `backend/`: `uvicorn app.main:app --reload`.\n4. Separate terminal, `frontend/`: `npm run dev`.\n\nDocument the seed command after migrations and before first demo, with configured bootstrap admin credentials. Explain logs/health inspection and `docker compose down` retaining data. Volume deletion is destructive, not normal setup; changed initialization credentials do not automatically alter an existing database. Never delete developer data to make checks pass.", "stories": ["000"], "related": [], "fields": {}}, "design": {"title": "Frontend UX/UI design and inspiration", "status": "Technical constraint", "ref": "§05", "text": "Use **shadcn/ui and Tailwind CSS** as the primary UI foundation. Create a cohesive, clean, modern, minimal enterprise interface suited to an internal tool. Favor readable content and efficient task completion over decoration.\n\nPrimary reference: [shadcn/ui Blocks](https://ui.shadcn.com/blocks); use [shadcn/ui Components](https://ui.shadcn.com/docs/components) for consistent controls and interaction patterns.\n\n| Reference | Intended inspiration |\n|---|---|\n| `dashboard-01` | Application shell, content hierarchy, and data-table presentation; omit unrelated charts and metrics. |\n| `sidebar-07` | Responsive authenticated navigation with a collapsible sidebar. |\n| `login-03` | Focused authentication form and restrained page composition. |\n\nTreat these as visual/interaction references, not mandatory templates or additional feature requirements. Adapt them to the actual account and return workflows. Do not import sample dashboards, signup, social login, team switching, charts, or other unrelated features merely because a reference includes them.\n\n- Use a neutral light theme with restrained accent colors. Apply consistent typography, spacing, surfaces, borders, and component variants through the existing Tailwind/shadcn conventions; no custom design-system framework is needed.\n- Reuse practical forms, tables, dialogs, badges, buttons, and feedback patterns across domains. Keep field labels, required-field indicators, inline validation, loading, empty, error, and success states consistent. Explain status with text, not color alone.\n- Use a responsive, collapsible sidebar for authenticated navigation where useful, with an accessible mobile presentation. Navigation reflects permitted workflows while backend authorization remains authoritative. Keep the current location clear and primary actions easy to find.\n- Make Record Garment, assessment save, and Confirm/Override actions visually clear. Distinguish recommended and confirmed routes, explain required evidence/override notes, and make confirmed read-only state apparent without changing business rules.\n- Support keyboard operation, visible focus, meaningful control labels, readable contrast, and appropriate dialog focus behavior. Validation messages must identify the field/problem and be accessible to assistive technology.\n- Ensure desktop, tablet, and mobile layouts remain usable: forms and dialogs fit the viewport; tables retain access to important data/actions through a suitable responsive layout or contained scrolling; navigation does not obscure the task.\n- Add only components and visual dependencies needed for these workflows. Avoid unnecessary animations, visual libraries, and bespoke styling abstractions. Usability and accessibility take priority over visual imitation.", "stories": [], "related": [], "fields": {}}, "strategy": {"title": "Implementation Strategy", "status": "Planned workflow", "ref": "§07", "text": "Use one sequential workflow for a solo developer with AI assistance. Implement small vertical slices: necessary Database change → Backend → usable Frontend → Focused Testing. A slice need not change every layer when existing components suffice. Enforce authorization from each feature's first version.\n\nSuggested dependency order:\n\n1. 000/001/002-2 plus minimum permissions: local setup → login → profile → logout.\n2. 003-1/003-2/005-1 plus basic detail: create Staff → sign in → record and retrieve a draft.\n3. Condition part of 005-2 and 005-3: assess → see persisted recommendation.\n4. Remaining 005-2 and 005-4: upload evidence → confirm/override → revisit saved detail.\n5. 003-3/003-4/004-1: user edit, status, and role actions as small slices.\n6. 002-1/003-5: change password, direct Admin reset, and token recovery as working slices.\n7. Remaining 004-2/004-3: permission editing and access review; address U-ACCESS before implementing unsupported grants.\n8. Final verification of all stories; no new scope.\n\nAfter each slice run focused checks and relevant regressions, inspect the diff, and update acceptance evidence. Commit each successfully verified milestone on the existing branch with a clear behavior-based message. Stage only related files; preserve unrelated edits and exclude secrets/uploads/caches. No ownership assignments, PR gates, migration coordination, remote pushes, or parallel-agent workflow are required. Report blockers honestly and continue independent work.\n\nKeep Alembic revisions simple/sequential, inspect generated changes, and preserve applied history. Record implementation decisions only when useful in README or code. Milestones are checkpoints, not permission to stop after the first demo. Choose straightforward internal details when requirements do not prescribe them.", "stories": [], "related": [], "fields": {}}, "verification": {"title": "Verification & Definition of Done", "status": "Required verification", "ref": "§08", "text": "Use isolated PostgreSQL integration tests for persistence, validation, authorization, and integrity. Never reset a developer/user database. Unit-test pure rules when useful. Automate critical browser workflows without duplicating every backend edge case at browser level. A single meaningful test may cover multiple criteria; no arbitrary coverage percentage, load suite, or exhaustive concurrency framework is required.\n\nCover the success/rejection outcomes in Section 06 and these essential guarantees:\n\n- All four roles authenticate; invalid/expired tokens, disabled sessions, and unauthenticated requests fail. Cookie/CSRF protection, logout, and safe responses work.\n- Password changes and both resets reject old credentials/sessions; invalid/expired/used tokens do not mutate accounts. Token use is atomic.\n- User mutations enforce uniqueness/protected fields and refresh UI; status/role changes affect subsequent requests; self-disable/last-admin protections hold.\n- Matrix and read-only view match persisted grants; each role has an allowed/blocked action under initial configuration; supported revoke/restore takes effect without another login. Do not test an invented resolution of U-ACCESS.\n- Garments remain retrievable after a new session; routing/evidence use the provisional rules; invalid uploads, cross-store access, blank override notes, and post-confirmation edits fail. Same-store peers retain permitted access.\n- Targeted competing-write checks cover confirmation versus assessment and reset-token single use; verify remaining database/last-admin safeguards with focused tests. Protect supporting endpoints as well as main endpoints.\n\nVerify the Section 05 UI guidance during these same workflows: desktop/tablet/mobile layout, keyboard navigation and visible focus, dialog behavior, clear validation/feedback, and reachable primary actions. Use focused browser assertions and a brief visual review; no separate visual-regression framework is required.\n\nCritical browser coverage includes login/profile, password flows, account administration/access configuration, and the Sprint demo. For accepted operations assert persisted/read-back state; for invalid or denied mutations assert unchanged state and no unauthorized disclosure.\n\nDemonstrate Admin creates Staff with a store → Staff signs in → records garment → saves assessment → reviews recommendation → uploads required evidence → confirms or overrides with a note → signs out/in → finds the record via the list → views the saved result. Separately demonstrate account actions, role/permission changes, recovery, and unauthorized-access rejection.\n\nBefore completion run the full implemented backend test suite, frontend type checking/lint/build, and critical browser suite. Verify clean-database Alembic migration, repeated seeding without resetting grants/credentials, PostgreSQL health/persistence, documented host startup, and an alternate host port once. No infrastructure test framework is necessary.\n\nCompletion requires passing evidence for all 16 stories and their ACs. If a decision or environment blocks a check, report the affected behavior/check as unresolved, blocked, or not run; a working demo alone is insufficient for a full-completion claim.", "stories": [], "related": [], "fields": {}}, "trace": {"title": "Lightweight traceability", "status": "Required verification", "ref": "§08", "text": "Maintain only these checklist columns in `docs/acceptance.md`:\n\n| Story ID | AC ID | Test Reference | Result | Status |\n|---|---|---|---|---|\n| 001 | AC-001-02 | Actual test file/test name once implemented | Observed result | not run / passed / failed / blocked |\n\nUse a row per AC; shared test references are acceptable. Include short open-decision and current/next-slice notes. Do not reproduce API/schema/UI matrices or business rules. Never mark an unrun check passed or a partially verified story complete.", "stories": [], "related": [], "fields": {}}, "deliverables": {"title": "Expected Deliverables", "status": "Required deliverables", "ref": "§09", "text": "- Working Next.js frontend and FastAPI backend organized by the specified domains, with a cohesive responsive shadcn/ui + Tailwind interface meeting Section 05.\n- PostgreSQL-only `compose.yaml`, persistent storage, and root/backend/frontend environment examples.\n- SQLAlchemy models, Alembic migrations, and idempotent seed data with bootstrap instructions.\n- Meaningful functional/integration tests and critical browser tests.\n- README with reproducible prerequisites, setup, startup, migration/seed/test commands, technical defaults, data-preservation guidance, and manual reset-link delivery instructions.\n- Lightweight acceptance checklist with actual evidence and remaining decisions.\n- Concise final report of implemented behavior, checks run/results, remaining blockers, and provisional assumptions still in use. Do not claim checks or business decisions were completed without evidence.", "stories": [], "related": [], "fields": {}}, "auth": {"title": "auth", "status": "In scope", "ref": "§03 + §05", "text": "Authenticate by email/password with `POST /auth/login`; display failures and redirect to an available destination appropriate to the user's role. Include logout as supporting behavior.\n\nProvide current/new/confirm password UI and `POST /auth/change-password`. Provide token-based recovery through `POST /auth/reset-password` and a reset page. Make token delivery usable through P-RECOVERY; keep this separate from 003-5.", "stories": ["001", "002-1"], "related": ["BR-05", "P-RECOVERY"], "fields": {}}, "users": {"title": "users", "status": "In scope", "ref": "§03 + §05", "text": "`GET /users/me` and Profile show the current account's name, email, role, and status; anonymous access is blocked.\n\n`GET /users` feeds an administrative table showing name, email, role, and active/disabled status.\n\n`POST /users` and Add User accept name, email, role, and initial password, with store assignment under P-STORE. Refresh the table after success.\n\n`PATCH /users/{id}` and a prefilled Edit User form update the allowed profile fields in BR-04; show saved values.\n\n`PATCH /users/{id}/status` and table actions change account status according to BR-04.\n\n`POST /users/{id}/reset-password` accepts or generates a temporary password. Provide confirmation and an intentional result view if a password is generated.", "stories": ["002-2", "003-1", "003-2", "003-3", "003-4", "003-5"], "related": ["BR-04", "P-STORE"], "fields": {}}, "access_control": {"title": "access_control", "status": "In scope", "ref": "§03 + §05", "text": "`PATCH /users/{id}/role` and a role selector update the user's role subject to Section 04.\n\nPersist permissions and role grants; seed definitions for Account, Return, Batch, Outcome, Validation, and Report. Provide reusable `require_permission()`, `GET /roles/permissions`, and an atomic `PUT /roles/{role}/permissions`, plus a roles × permissions editor. Mark future-module keys reserved; apply U-ACCESS before enabling unsupported grants.\n\nReuse the permission read endpoint for a read-only view grouped by role, clearly showing allowed/blocked permissions and effective restrictions.", "stories": ["004-1", "004-2", "004-3"], "related": ["BR-06", "U-ACCESS"], "fields": {}}, "returns": {"title": "returns", "status": "In scope", "ref": "§03 + §05", "text": "`POST /garments` and Record Garment save the BR-02 fields, then show the generated ID and link to detail.\n\n`PATCH /garments/{id}/condition` saves assessment; `POST /garments/{id}/evidence` saves validated files and metadata. Detail provides condition selection, upload/view controls, and the evidence requirement.\n\n`GET /garments/{id}` returns the saved recommendation; the Recommended Route card also handles an unassessed garment.\n\n`POST /garments/{id}/confirm-route` and Confirm/Override UI persist the final decision under BR-03.", "stories": ["005-1", "005-2", "005-3", "005-4"], "related": ["BR-02", "BR-03", "P-ROUTE", "P-EVIDENCE", "P-STORE"], "fields": {}}, "ADMIN": {"title": "ADMIN", "status": "Initial grants", "ref": "§04 / Initial Sprint grants", "text": "“Confirmed” includes explicit user-selected Sprint behavior; it does not imply every detail appeared in the original backlog.\n\n- **BR-01 — Allowed values:** Roles are exactly `ADMIN`, `STORE_STAFF`, `CONTRACTOR`, `HEAD`; conditions exactly `GOOD`, `WORN`, `DAMAGED`, `STAINED`; destinations exactly `DIRECT_RESALE_CANDIDATE`, `THIRD_PARTY_CONTRACTOR`. A resale candidate is not a completed resale, and contractor routing is not a recycling outcome.\n- **BR-02 — Garment data:** One record represents one item. Persist generated ID, required text type/material, positive finite weight in kilograms, store, creator, and creation time. Condition alone determines recommendation; no type/material routing rules.\n- **BR-03 — Assessment and confirmation:** Creation saves an unassessed draft. Saving condition updates recommendation. Staff may confirm the recommendation without a note or choose the other valid route with a nonblank trimmed override note. Confirmation requires assessment and any P-EVIDENCE proof, persists route/note/time, and makes the route and relevant assessment/evidence read-only. Reject repeated confirmation; retain view access. No reopening/revision workflow.\n- **BR-04 — Account administration:** User/role/permission administration is ADMIN-only. General user edit allows name/email only; role, status, and password changes use designated actions. Prevent Admin self-disable and removing the last usable administrator's management access.\n- **BR-05 — Self-service:** Every active role can authenticate, view its own profile, and manage its own password. Password change requires the current password. Recovery requires an unexpired unused valid token. Admin reset replaces another user's password with an accepted/generated temporary password. No forced first-login password change.\n- **BR-06 — Authorization:** Current permission grants apply on subsequent requests. Administrative grants cannot bypass BR-04. Return access additionally obeys P-STORE. No implicit ADMIN bypass. Authentication/self-service remains available to active accounts. Garment list/detail/evidence share read authorization; reset-link issuance requires Admin reset authority; store selection uses applicable account-management authority.\n\nInitial Sprint grants:\n\n| Capability | ADMIN | STORE_STAFF | CONTRACTOR | HEAD |\n|---|---|---|---|---|\n| BR-05 self-service | Yes | Yes | Yes | Yes |\n| BR-04 administration and access review | Yes | No | No | No |\n| Record/read/assess garments, upload evidence, confirm/override | No | Yes | No | No |\n\nThis establishes initial behavior, not an answer to U-ACCESS. HEAD/CONTRACTOR have no operational features in this initial setup.", "stories": [], "related": ["BR-04", "BR-05", "BR-06", "U-ACCESS", "P-STORE"], "fields": {}}, "STORE_STAFF": {"title": "STORE_STAFF", "status": "Initial grants", "ref": "§04 / Initial Sprint grants", "text": "“Confirmed” includes explicit user-selected Sprint behavior; it does not imply every detail appeared in the original backlog.\n\n- **BR-01 — Allowed values:** Roles are exactly `ADMIN`, `STORE_STAFF`, `CONTRACTOR`, `HEAD`; conditions exactly `GOOD`, `WORN`, `DAMAGED`, `STAINED`; destinations exactly `DIRECT_RESALE_CANDIDATE`, `THIRD_PARTY_CONTRACTOR`. A resale candidate is not a completed resale, and contractor routing is not a recycling outcome.\n- **BR-02 — Garment data:** One record represents one item. Persist generated ID, required text type/material, positive finite weight in kilograms, store, creator, and creation time. Condition alone determines recommendation; no type/material routing rules.\n- **BR-03 — Assessment and confirmation:** Creation saves an unassessed draft. Saving condition updates recommendation. Staff may confirm the recommendation without a note or choose the other valid route with a nonblank trimmed override note. Confirmation requires assessment and any P-EVIDENCE proof, persists route/note/time, and makes the route and relevant assessment/evidence read-only. Reject repeated confirmation; retain view access. No reopening/revision workflow.\n- **BR-04 — Account administration:** User/role/permission administration is ADMIN-only. General user edit allows name/email only; role, status, and password changes use designated actions. Prevent Admin self-disable and removing the last usable administrator's management access.\n- **BR-05 — Self-service:** Every active role can authenticate, view its own profile, and manage its own password. Password change requires the current password. Recovery requires an unexpired unused valid token. Admin reset replaces another user's password with an accepted/generated temporary password. No forced first-login password change.\n- **BR-06 — Authorization:** Current permission grants apply on subsequent requests. Administrative grants cannot bypass BR-04. Return access additionally obeys P-STORE. No implicit ADMIN bypass. Authentication/self-service remains available to active accounts. Garment list/detail/evidence share read authorization; reset-link issuance requires Admin reset authority; store selection uses applicable account-management authority.\n\nInitial Sprint grants:\n\n| Capability | ADMIN | STORE_STAFF | CONTRACTOR | HEAD |\n|---|---|---|---|---|\n| BR-05 self-service | Yes | Yes | Yes | Yes |\n| BR-04 administration and access review | Yes | No | No | No |\n| Record/read/assess garments, upload evidence, confirm/override | No | Yes | No | No |\n\nThis establishes initial behavior, not an answer to U-ACCESS. HEAD/CONTRACTOR have no operational features in this initial setup.", "stories": [], "related": ["BR-04", "BR-05", "BR-06", "U-ACCESS", "P-STORE"], "fields": {}}, "CONTRACTOR": {"title": "CONTRACTOR", "status": "Initial grants", "ref": "§04 / Initial Sprint grants", "text": "“Confirmed” includes explicit user-selected Sprint behavior; it does not imply every detail appeared in the original backlog.\n\n- **BR-01 — Allowed values:** Roles are exactly `ADMIN`, `STORE_STAFF`, `CONTRACTOR`, `HEAD`; conditions exactly `GOOD`, `WORN`, `DAMAGED`, `STAINED`; destinations exactly `DIRECT_RESALE_CANDIDATE`, `THIRD_PARTY_CONTRACTOR`. A resale candidate is not a completed resale, and contractor routing is not a recycling outcome.\n- **BR-02 — Garment data:** One recor
